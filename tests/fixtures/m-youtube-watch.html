<!doctype html>
<!--
  Trimmed skeleton of a YouTube mobile watch page (m.youtube.com/watch?v=sampleVid01),
  captured 2026-11-24 in Playwright Chromium at 390x844 (isMobile, hasTouch, Android
  Chrome user agent), logged out, en-US (docs/notes/mobile.md "m.youtube.com layout").
  Kept: #player-container-id (a child of <body>, outside ytm-app) with #movie_player
  (video, caption container), the player controls beside it, and ytm-app's watch page
  down to the metadata section. Removed: scripts, styles, images, SVG paths, the
  controls' contents, the comments teaser, the related videos' contents and most
  attributes. The <style> block is not YouTube's: it only pins the player under the
  48px header and keeps its place in the page, as YouTube's styles do.
  Used by mobile-layout.browser.test.ts and, for E2E, served at
  https://m.youtube.com/watch* with context.route.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A lantern for the lighthouse | Sample Channel - YouTube</title>
    <style>
      body {
        margin: 0;
        font-family: Roboto, Arial, sans-serif;
      }
      ytm-app,
      ytm-mobile-topbar-renderer,
      ytm-watch,
      ytm-single-column-watch-next-results-renderer,
      ytm-slim-video-metadata-section-renderer,
      ytm-item-section-renderer {
        display: block;
      }
      ytm-mobile-topbar-renderer {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        z-index: 3;
        background: #fff;
      }
      .page-container {
        padding-top: 48px;
      }
      /* Pinned under the header while the page scrolls under it. */
      #player-container-id {
        position: fixed;
        top: 48px;
        left: 0;
        right: 0;
        z-index: 2;
        background: #000;
      }
      #player-container-id:fullscreen {
        top: 0;
      }
      .player-size {
        aspect-ratio: 16 / 9;
      }
      #player {
        position: relative;
      }
      #movie_player {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .html5-video-container,
      video.html5-main-video {
        width: 100%;
        height: 100%;
      }
      .ytp-caption-window-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .related-items-container {
        height: 3000px;
      }
    </style>
  </head>
  <body>
    <div id="player-container-id" class="player-container sticky-player">
      <div id="player-cinematics-container" class="player-cinematics"></div>
      <div id="player" class="player-api player-size">
        <div
          id="movie_player"
          class="html5-video-player ytp-transparent ytp-hide-controls ytp-exp-bottom-control-flexbox ytp-modern-caption ytp-mweb-player ytp-fit-cover-video ytp-hide-info-bar ytp-xsmall-width-mode playing-mode ytp-autohide"
          aria-label="YouTube Video Player"
        >
          <div class="html5-video-container">
            <video class="video-stream html5-main-video" playsinline></video>
          </div>
          <div class="ytp-player-content ytp-timely-actions-content"></div>
          <div
            id="ytp-caption-window-container"
            class="ytp-caption-window-container"
          ></div>
        </div>
      </div>
      <div id="player-control-container">
        <ytm-custom-control class="ytmCustomControlHost">
          <ytm-watch-player-controls class="ytmWatchPlayerControlsHost">
            <div
              id="player-control-overlay"
              class="new-controls bigbar medium-modification"
            >
              <div class="player-controls-content">
                <div
                  class="player-controls-bottom player-controls-bottom-right"
                >
                  <button
                    class="icon-button fullscreen-icon"
                    aria-label="Enter full screen"
                  ></button>
                </div>
              </div>
            </div>
          </ytm-watch-player-controls>
        </ytm-custom-control>
      </div>
      <div id="player-endscreen-container"></div>
      <div id="player-shorts-container"></div>
    </div>
    <ytm-app id="app" class="sticky-player">
      <div class="mobile-topbar-header-background"></div>
      <ytm-mobile-topbar-renderer
        id="header-bar"
        class="sticky-player"
      ></ytm-mobile-topbar-renderer>
      <div class="page-container">
        <ytm-watch class="ambient-topbar rounded-edges">
          <div class="player-size player-placeholder"></div>
          <div class="watch-below-the-player">
            <div class="below-the-player-cinematic-container"></div>
            <ytm-single-column-watch-next-results-renderer
              class="watch-content full-bleed-wn-thumbs"
            >
              <ytm-slim-video-metadata-section-renderer>
                <yt-video-metadata-view-model
                  class="ytVideoMetadataViewModelHost ytVideoMetadataViewModelInteractive"
                >
                  <div class="ytVideoMetadataViewModelContent">
                    <h2
                      class="ytVideoMetadataViewModelTitle ytVideoMetadataViewModelTitleOverflow"
                    >
                      A lantern for the lighthouse | Sample Channel
                    </h2>
                    <div class="ytVideoMetadataViewModelSubtitleContainer">
                      Sample Channel · 26M views · 18y ago
                    </div>
                  </div>
                </yt-video-metadata-view-model>
              </ytm-slim-video-metadata-section-renderer>
              <ytm-item-section-renderer
                class="scwnr-content single-column-watch-next-modern-panels"
              ></ytm-item-section-renderer>
              <div class="related-items-container"></div>
            </ytm-single-column-watch-next-results-renderer>
          </div>
        </ytm-watch>
      </div>
    </ytm-app>
  </body>
</html>
