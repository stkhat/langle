name: CI

# Tests run locally first: `npm run verify` before every push, which the pre-push hook
# enforces (scripts/pre-push.ts). GitHub runs them once a pull request is ready to merge:
# not on drafts, not on pushes to main (merged pull requests were already tested). Mark a
# pull request "Ready for review" to run this, or start it by hand. Pull requests that
# change only docs/ do not run it: no check, test or build reads those files.
#
# Only what Linux can tell apart from the dev Mac runs here: `npm run check` gives the
# same answer on any OS and already ran in `verify`. Release zips come from release.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Playwright image for the @playwright/test in package-lock.json, so a Playwright
  # bump (Dependabot's, say) needs no workflow edit. Reads the lockfile only: no npm ci.
  image:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: image
        run: echo "image=$(node scripts/playwright-image.ts)" >> "$GITHUB_OUTPUT"

  # One Linux job for everything else: each extra job pays for its own setup and `npm ci`.
  # It runs in Playwright's image, which has the browsers and their system libraries
  # installed. cross-os.yml runs the tests on macOS and Windows by hand.
  ci:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      options: --user 1001
    env:
      PLAYWRIGHT_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # node_modules for this lockfile, Node version and image; `npm ci` only on a miss.
      # cache.yml makes it on main, where every pull request can restore it.
      - id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ env.PLAYWRIGHT_IMAGE }}-${{ hashFiles('package-lock.json', '.nvmrc') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.node-modules.outputs.cache-hit == 'true'
        run: npx wxt prepare
      - run: npm test
      - run: npm run test:browser
      - run: npm run build
      - run: npm run build:check
      - run: npm run build:check-download
      - run: npm run build:app
      - run: npm run test:manifest
      - run: npm run test:e2e
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
